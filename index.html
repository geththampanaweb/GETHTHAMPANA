<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PROJECT: BIRTHDAY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
    --pink:#ff5ca8;
    --purple:#8b6cff;
    --cyan:#62e6ff;
    --white:#f5f5f7;
    --muted:#8f9099;
    --bg:#050507;
}

html{scroll-behavior:smooth}

body{
    background:var(--bg);
    color:var(--white);
    font-family:"DM Mono",monospace;
    overflow:hidden;
}

button{
    font-family:inherit;
}

/* ==============================
   GLOBAL
============================== */

.scene{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .8s ease,visibility .8s;
}

.scene.active{
    opacity:1;
    visibility:visible;
}

.noise{
    position:fixed;
    inset:0;
    z-index:999;
    pointer-events:none;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
}

.grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    mask-image:linear-gradient(to bottom,transparent,black 30%,black 70%,transparent);
}

.scanline{
    position:absolute;
    left:0;
    right:0;
    height:2px;
    background:rgba(98,230,255,.12);
    animation:scan 5s linear infinite;
}

@keyframes scan{
    from{top:-5%}
    to{top:105%}
}

.small{
    font-size:11px;
    color:var(--muted);
    letter-spacing:2px;
}

.cursor{
    display:inline-block;
    width:7px;
    height:16px;
    background:var(--cyan);
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

.btn{
    border:1px solid rgba(98,230,255,.4);
    background:rgba(98,230,255,.04);
    color:var(--cyan);
    padding:14px 24px;
    cursor:pointer;
    letter-spacing:2px;
    transition:.3s;
}

.btn:hover{
    background:rgba(98,230,255,.12);
    box-shadow:0 0 30px rgba(98,230,255,.12);
    transform:translateY(-2px);
}

.btn.pink{
    color:#ff79b8;
    border-color:rgba(255,92,168,.4);
}

/* ==============================
   SCENE 1
============================== */

#scene1{
    text-align:center;
    background:
        radial-gradient(circle at 50% 50%,rgba(98,230,255,.05),transparent 35%),
        #050507;
}

.boot{
    width:min(800px,90%);
}

.boot-top{
    display:flex;
    justify-content:space-between;
    color:#555;
    font-size:10px;
    margin-bottom:60px;
}

.system{
    font-size:clamp(11px,2vw,14px);
    color:var(--cyan);
    letter-spacing:3px;
    margin-bottom:30px;
}

.boot h1{
    font-size:clamp(42px,9vw,100px);
    line-height:.9;
    font-family:"Playfair Display",serif;
    font-weight:500;
    letter-spacing:-4px;
}

.boot h1 span{
    color:var(--pink);
}

.boot-desc{
    color:#777;
    max-width:500px;
    margin:30px auto 45px;
    line-height:1.8;
    font-size:13px;
}

.loading{
    height:2px;
    background:#15151a;
    width:100%;
    margin:25px 0;
    overflow:hidden;
}

.loading div{
    height:100%;
    width:0;
    background:var(--cyan);
    box-shadow:0 0 15px var(--cyan);
    transition:width 2s;
}

/* ==============================
   SCENE 2 TERMINAL
============================== */

.terminal{
    width:min(900px,92%);
    border:1px solid #25262d;
    background:#09090c;
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.terminal-head{
    height:45px;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-bottom:1px solid #202127;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    margin-right:7px;
    background:#333;
}

.terminal-title{
    margin-left:15px;
    color:#555;
    font-size:10px;
}

.terminal-body{
    padding:30px;
    min-height:450px;
}

.line{
    margin:9px 0;
    font-size:13px;
    line-height:1.7;
}

.green{color:#72e6a1}
.blue{color:var(--cyan)}
.pink{color:var(--pink)}
.gray{color:#555}

.progress{
    margin:25px 0;
    height:8px;
    background:#16171c;
}

.progress div{
    width:0;
    height:100%;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    transition:width 2s;
}

.terminal-button{
    margin-top:25px;
    opacity:0;
    pointer-events:none;
}

.terminal-button.show{
    opacity:1;
    pointer-events:auto;
}

/* ==============================
   SCENE 3 PROFILE
============================== */

.profile{
    width:min(1000px,90%);
}

.profile-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:35px;
}

.profile h2{
    font-family:"Playfair Display",serif;
    font-size:clamp(45px,7vw,80px);
    font-weight:500;
}

.profile h2 span{
    color:var(--pink);
}

.profile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    border:1px solid #202127;
    padding:25px;
    background:rgba(255,255,255,.015);
}

.card h3{
    color:#666;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:20px;
}

.data{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid #17181c;
    font-size:12px;
}

.data:last-child{border:0}

.value{color:var(--cyan)}

.big-status{
    font-size:clamp(30px,5vw,55px);
    font-family:"Playfair Display",serif;
    color:var(--pink);
    margin:25px 0;
}

/* ==============================
   SCENE 4 MEMORY
============================== */

.memory{
    width:min(1100px,92%);
}

.memory h2{
    font-family:"Playfair Display",serif;
    font-size:clamp(45px,8vw,90px);
    font-weight:500;
    margin-bottom:10px;
}

.memory h2 span{color:var(--pink)}

.memory-sub{
    color:#666;
    margin-bottom:40px;
}

.memory-card{
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:450px;
    border:1px solid #25262d;
    background:#08080b;
}

.memory-image{
    overflow:hidden;
}

.memory-image img{
    width:100%;
    height:100%;
    min-height:450px;
    object-fit:cover;
    filter:saturate(.7);
    transition:1s;
}

.memory-card:hover img{
    transform:scale(1.04);
}

.memory-info{
    padding:45px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.memory-number{
    color:var(--pink);
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:25px;
}

.memory-info h3{
    font-family:"Playfair Display",serif;
    font-size:42px;
    font-weight:500;
    margin-bottom:20px;
}

.memory-info p{
    color:#777;
    line-height:1.9;
    font-size:13px;
}

.memory-controls{
    margin-top:30px;
    display:flex;
    gap:10px;
}

/* ==============================
   SCENE 5 QUESTION
============================== */

.question{
    text-align:center;
    width:min(700px,90%);
}

.question-number{
    color:var(--pink);
    font-size:11px;
    letter-spacing:4px;
    margin-bottom:30px;
}

.question h2{
    font-family:"Playfair Display",serif;
    font-size:clamp(40px,7vw,75px);
    font-weight:500;
    margin-bottom:20px;
}

.question p{
    color:#666;
    font-size:13px;
    margin-bottom:40px;
}

.options{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.option{
    background:transparent;
    border:1px solid #282930;
    color:#aaa;
    padding:15px 25px;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    border-color:var(--pink);
    color:white;
}

.answer{
    min-height:100px;
    margin-top:40px;
    color:var(--pink);
    line-height:1.8;
}

/* ==============================
   SCENE 6 UNIVERSE
============================== */

#scene6{
    overflow:hidden;
    background:#020204;
}

.universe{
    position:absolute;
    inset:0;
}

.star2{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    animation:starPulse 3s infinite alternate;
}

@keyframes starPulse{
    from{opacity:.1}
    to{opacity:1}
}

.universe-content{
    position:relative;
    z-index:3;
    text-align:center;
    width:90%;
}

.universe-line{
    opacity:0;
    transition:2s;
    font-family:"Playfair Display",serif;
    font-size:clamp(25px,5vw,55px);
    margin:18px 0;
}

.universe-line.show{opacity:1}

.big-heart{
    font-size:100px;
    opacity:0;
    transform:scale(.3);
    transition:2s;
    color:var(--pink);
    text-shadow:0 0 70px rgba(255,92,168,.7);
}

.big-heart.show{
    opacity:1;
    transform:scale(1);
}

/* ==============================
   SCENE 7 LOCK
============================== */

.lock{
    text-align:center;
    width:min(700px,90%);
}

.lock-icon{
    font-size:70px;
    margin-bottom:30px;
    filter:grayscale(1);
}

.lock h2{
    font-family:"Playfair Display",serif;
    font-size:clamp(40px,7vw,70px);
    font-weight:500;
}

.lock p{
    color:#666
